<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AntiGem</title>
    <!--
      Launch splash, as the Android app starts (res/values/themes.xml, drawable/splash_prism_animated.xml,
      drawable/splash_wordmark.xml): the Prism mark on graphite, its crown lifting into place while the seam of light
      brightens and a glow blooms, then the crown hovers, the glow breathes and the spectrum flows along the seam.
      Static HTML + CSS (no script: the webview's policy allows none inline); main.tsx fades it out once the UI is up.
      Light themes get the app's light background with the mark on its graphite icon tile.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111217;
      }
      #splash {
        --sb: #111217;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--sb);
        transition: opacity 240ms cubic-bezier(0.4, 0, 1, 1);
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash .tile {
        width: 220px;
        height: 220px;
        max-width: 56vw;
        max-height: 56vw;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 28%;
      }
      #splash svg.mark {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #splash svg.word {
        width: 200px;
        height: 80px;
        margin-top: -34px;
        opacity: 0;
        animation: sp-fade 500ms 150ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #splash .crown-lift {
        transform: translateY(2px);
        animation: sp-lift 450ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #splash .crown-hover {
        animation: sp-hover 1300ms 700ms cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }
      #splash .glow {
        transform-origin: 54px 47.5px;
        transform: scale(0.4);
        animation: sp-bloom 420ms linear forwards;
      }
      #splash .glow-path {
        opacity: 0;
        animation:
          sp-glow-in 250ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
          sp-breathe 1300ms 700ms cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }
      #splash .seam {
        fill-opacity: 0.3;
        animation: sp-seam 400ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #splash .seam-flow {
        animation: sp-flow 1200ms linear infinite;
      }
      @keyframes sp-lift {
        to {
          transform: translateY(0);
        }
      }
      @keyframes sp-hover {
        to {
          transform: translateY(-0.9px);
        }
      }
      @keyframes sp-bloom {
        60% {
          transform: scale(1.15);
          animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes sp-glow-in {
        to {
          opacity: 1;
        }
      }
      @keyframes sp-breathe {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.6;
        }
      }
      @keyframes sp-seam {
        to {
          fill-opacity: 1;
        }
      }
      @keyframes sp-flow {
        to {
          transform: translateX(50px);
        }
      }
      @keyframes sp-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f9f9fb;
        }
        #splash {
          background: #f9f9fb;
        }
        /* the mark on its graphite icon tile (ic_launcher_background), the wordmark in the light theme's grey */
        #splash .tile {
          width: 132px;
          height: 132px;
          background: #111217;
          box-shadow:
            0 10px 30px rgba(17, 18, 23, 0.18),
            0 2px 6px rgba(17, 18, 23, 0.12);
          animation: sp-fade 300ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        #splash svg.word {
          margin-top: -14px;
        }
        #splash svg.word path {
          fill: #6b7080;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="tile">
        <svg class="mark" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sp-glow" cx="54" cy="47.5" r="28" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9FD8FF" stop-opacity="0.5" />
              <stop offset="1" stop-color="#9FD8FF" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="sp-crown-top" x1="0" y1="33" x2="0" y2="42" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18" />
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="sp-crown-light" x1="0" y1="38" x2="0" y2="45" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9FD8FF" stop-opacity="0" />
              <stop offset="1" stop-color="#9FD8FF" stop-opacity="0.38" />
            </linearGradient>
            <linearGradient id="sp-pav-shade" x1="0" y1="50" x2="0" y2="75" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#000000" stop-opacity="0" />
              <stop offset="1" stop-color="#000000" stop-opacity="0.28" />
            </linearGradient>
            <linearGradient id="sp-pav-light" x1="0" y1="50" x2="0" y2="58" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9FD8FF" stop-opacity="0.38" />
              <stop offset="1" stop-color="#9FD8FF" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="sp-spectrum" x1="29" y1="47.5" x2="79" y2="47.5" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
              <stop offset="0" stop-color="#5EE7FF" />
              <stop offset="0.3" stop-color="#FFFFFF" />
              <stop offset="0.55" stop-color="#C79BFF" />
              <stop offset="0.8" stop-color="#FFB86B" />
              <stop offset="1" stop-color="#5EE7FF" />
            </linearGradient>
            <linearGradient id="sp-fade-l" x1="29" y1="0" x2="39" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#111217" />
              <stop offset="1" stop-color="#111217" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="sp-fade-r" x1="69" y1="0" x2="79" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#111217" stop-opacity="0" />
              <stop offset="1" stop-color="#111217" />
            </linearGradient>
            <clipPath id="sp-seam-clip">
              <path d="M29.6,46.9H78.4A0.6,0.6 0,0 1,78.4 48.1H29.6A0.6,0.6 0,0 1,29.6 46.9Z" />
            </clipPath>
          </defs>
          <!-- glow around the seam: a circle squashed into an ellipse -->
          <g class="glow">
            <g transform="translate(0 35.625) scale(1 0.25)">
              <path class="glow-path" fill="url(#sp-glow)" d="M26,47.5a28,28 0,1 0,56 0a28,28 0,1 0,-56 0Z" />
            </g>
          </g>
          <!-- crown: starts lowered, lifts into place, then hovers -->
          <g class="crown-lift">
            <g class="crown-hover">
              <path fill="#C9D1DC" d="M41,33L67,33L77,45L31,45Z" />
              <path fill="#D3DAE4" d="M41,33L31,45L47.5,45Z" />
              <path fill="#FFFFFF" d="M41,33L54,33L47.5,45Z" />
              <path fill="#E8EDF3" d="M54,33L47.5,45L60.5,45Z" />
              <path fill="#AFB9C8" d="M54,33L67,33L60.5,45Z" />
              <path fill="#808C9E" d="M67,33L60.5,45L77,45Z" />
              <path fill="url(#sp-crown-top)" d="M41,33L67,33L77,45L31,45Z" />
              <path fill="url(#sp-crown-light)" d="M41,33L67,33L77,45L31,45Z" />
              <path d="M41,33L67,33" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.8" stroke-linecap="round" fill="none" />
            </g>
          </g>
          <!-- pavilion (the base) -->
          <g>
            <path fill="#8893A5" d="M31,50L77,50L54,75Z" />
            <path fill="#9AA5B6" d="M31,50L47.5,50L54,75Z" />
            <path fill="#DCE2EA" d="M47.5,50L54,50L54,75Z" />
            <path fill="#69748A" d="M54,50L60.5,50L54,75Z" />
            <path fill="#3E4757" d="M60.5,50L77,50L54,75Z" />
            <path fill="url(#sp-pav-shade)" d="M31,50L77,50L54,75Z" />
            <path fill="url(#sp-pav-light)" d="M31,50L77,50L54,75Z" />
          </g>
          <!-- the seam of light: the spectrum flows left to right, its ends fade into the graphite -->
          <g clip-path="url(#sp-seam-clip)">
            <g class="seam-flow">
              <path class="seam" fill="url(#sp-spectrum)" d="M-21,46.9H79V48.1H-21Z" />
            </g>
            <path fill="url(#sp-fade-l)" d="M29,46.5H39V48.5H29Z" />
            <path fill="url(#sp-fade-r)" d="M69,46.5H79V48.5H69Z" />
          </g>
        </svg>
      </div>
      <!-- "ANTIGEM" wordmark (drawable/splash_wordmark.xml): Inter SemiBold capitals, the I split like the gem -->
      <svg class="word" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <g fill="#9AA0AB">
          <path d="M50.75 46 54.94 34H57.67L61.95 46H59.59L58.57 43.03H54.08L53.1 46ZM54.66 41.3H57.98L57.46 39.77Q57.19 38.94 56.91 37.93Q56.62 36.92 56.28 35.68Q55.96 36.93 55.69 37.95Q55.41 38.97 55.16 39.77Z" />
          <path d="M67.18 46V34H69.62L73.76 40.61Q74.09 41.13 74.46 41.82Q74.84 42.5 75.24 43.41Q75.17 42.54 75.14 41.69Q75.11 40.85 75.11 40.3V34H77.29V46H74.85L71.11 40.05Q70.79 39.55 70.51 39.06Q70.24 38.57 69.93 37.99Q69.62 37.41 69.22 36.63Q69.28 37.74 69.33 38.64Q69.37 39.54 69.37 40.04V46Z" />
          <path d="M82.8 35.81V34H92.35V35.81H88.65V46H86.5V35.81Z" />
          <path d="M97.85,34H100V38.8H97.85Z M97.85,40.36H100V46H97.85Z" />
          <path d="M111.23 46.16Q109.57 46.16 108.32 45.42Q107.07 44.67 106.37 43.29Q105.67 41.91 105.67 40.02Q105.67 38.08 106.39 36.7Q107.11 35.32 108.35 34.58Q109.59 33.84 111.16 33.84Q112.48 33.84 113.56 34.35Q114.63 34.85 115.33 35.76Q116.03 36.66 116.21 37.83H114.01Q113.72 36.88 113 36.32Q112.28 35.76 111.19 35.76Q110.22 35.76 109.46 36.26Q108.7 36.75 108.26 37.69Q107.83 38.64 107.83 40Q107.83 42.04 108.77 43.14Q109.72 44.24 111.24 44.24Q112.59 44.24 113.39 43.48Q114.2 42.71 114.23 41.42H111.46V39.73H116.32V41.17Q116.32 42.71 115.66 43.83Q115 44.95 113.86 45.56Q112.71 46.16 111.23 46.16Z" />
          <path d="M122.03 46V34H129.83V35.81H124.18V39.05H129.41V40.84H124.18V44.19H129.86V46Z" />
          <path d="M135.65 46V34H138.88L141.16 40.19Q141.28 40.55 141.44 41.12Q141.6 41.68 141.76 42.33Q141.92 42.98 142.06 43.58Q142.19 42.99 142.36 42.34Q142.52 41.69 142.67 41.12Q142.83 40.56 142.94 40.19L145.2 34H148.44V46H146.3V39.94Q146.3 39.49 146.31 38.83Q146.33 38.16 146.35 37.41Q146.37 36.67 146.37 35.95Q146.17 36.72 145.95 37.49Q145.72 38.25 145.52 38.9Q145.32 39.54 145.17 39.94L142.96 46H141.13L138.88 39.94Q138.74 39.56 138.54 38.93Q138.35 38.3 138.12 37.54Q137.9 36.79 137.68 36.01Q137.69 36.69 137.71 37.43Q137.73 38.16 137.75 38.82Q137.76 39.48 137.76 39.94V46Z" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
